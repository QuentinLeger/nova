<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Nova</title>
<style>
  body {
    background: #111;
    color: #eee;
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
  }
  #status {
    font-size: 14px;
    color: #888;
    margin-bottom: 20px;
  }
  #mic-btn {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: #333;
    border: 2px solid #555;
    color: #fff;
    font-size: 30px;
    cursor: pointer;
  }
  #mic-btn.listening {
    background: #c0392b;
    border-color: #e74c3c;
  }
  #transcript {
    margin-top: 20px;
    color: #aaa;
    min-height: 20px;
    font-style: italic;
  }
  #reponse {
    margin-top: 30px;
    max-width: 600px;
    text-align: center;
    font-size: 20px;
    line-height: 1.5;
  }
</style>
</head>
<body>

  <div id="status">Déconnecté</div>
  <button id="mic-btn">🎤</button>
  <div id="transcript"></div>
  <div id="reponse"></div>
  <textarea id="texteRep" ></textarea>
  <button id="submitRep">Submit</button>
  <div id="connecteWs">Deco</div>

<script>
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.lang = "fr-FR";
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    const ws = new WebSocket("ws://localhost:8000/ws");

    const status = document.querySelector("#status");
    const micBut = document.querySelector("#mic-btn")
    const transcript = document.querySelector("#transcript");
    const response = document.querySelector("#reponse");
    const wsConnected = document.querySelector("#connecteWs")
    const texteA = document.querySelector("#texteRep")
    const subBtn = document.querySelector("#submitRep")

    ws.onopen = () => {
      console.log("marche");
      wsConnected.textContent = `Connecté`;
    }

    recognition.onstart = () => {
      console.log("L'écoute a VRAIMENT démarré");
    }


    micBut.onclick = () => {
        try {
          recognition.start();
          console.log("En attente d'une commande")

          timeoutId = setTimeout (() => {
            console.log("Timeout : arrêt forcé de l'écoute");
            recognition.stop();
        }, 6000);
        } catch (e){
          console.log("Erreure : ",e);
        }

    }

    subBtn.onclick = () => {
      console.log(texteA.value)
      if (ws.readyState === WebSocket.OPEN){
          ws.send(JSON.stringify({ user_message: texteA.value }));
        }
    }


    recognition.onresult = (event) => {
      console.log("texte entendu")
        const texte = event.results[0][0].transcript;
        if (ws.readyState === WebSocket.OPEN){
          ws.send(JSON.stringify({ user_message: texte }));
        }
        response.textContent = `Resultat : ${texte}`;
    }

    recognition.onerror = (event) => {
      console.log("ERREUR MICRO :", event.error);
    }

    recognition.onend = () => {
      console.log("Écoute terminée");
      clearTimeout(timeoutId);
    }

    ws.onmessage = (event) => {
        console.log("coucou");
        const data = JSON.parse(event.data); // event.data = la string JSON reçue
        console.log(data.text); // "Message reçu !"
        transcript.textContent = data.text;
    }


</script>

</body>
</html>
